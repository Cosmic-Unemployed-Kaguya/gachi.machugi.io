plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'kaguya'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // gRPC
    implementation 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE'
    implementation 'io.grpc:grpc-stub:1.63.0'
    implementation 'io.grpc:grpc-protobuf:1.63.0'
    implementation 'com.google.protobuf:protobuf-java:4.28.2'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    // gRPC Validation (PGV)
    implementation 'build.buf.protoc-gen-validate:pgv-java-stub:1.1.0'
    implementation 'build.buf.protoc-gen-validate:pgv-java-grpc:1.1.0'

    // Google 공통 proto
    implementation 'com.google.api.grpc:proto-google-common-protos:2.28.0'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main {
        proto {
            srcDir '../../proto'
            include 'machugi/quiz/**'
        }
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }

    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.63.0'
        }

        validate {
            artifact = 'build.buf.protoc-gen-validate:protoc-gen-validate:1.1.0'
        }
    }

    generateProtoTasks {
        all()*.plugins {
            grpc {}

            validate {
                option 'lang=java'
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}