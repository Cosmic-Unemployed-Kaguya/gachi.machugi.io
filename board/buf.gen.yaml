version: v2
inputs:
  - directory: ../proto
    paths:
      - ../proto/machugi/board
      - ../proto/machugi/user
      - ../proto/machugi/quiz
plugins:
  - local: protoc-gen-ts_proto        # node_modules/.bin 사용
    out: src/generated
    opt: [outputServices=grpc-js, env=node, esModuleInterop=true, removeEnumPrefix=true]