syntax = "proto3";

package machugi.board;

import "google/protobuf/timestamp.proto";

// ----------------- 공용 ------------------
enum BoardState {
  BOARD_STATE_UNSPECIFIED = 0;
  BOARD_STATE_PUBLIC = 1;
  BOARD_STATE_PRIVATE = 2;
  BOARD_STATE_BLOCKED = 3;
}

message GrpcPagingRequest {
  // js 호환 상 int32 많이 쓴다고 함
  int32 page = 1;

  int32 size = 2;

  // nullable
  optional string search = 3;
  optional string filter = 4;
  optional string sort = 5;

  // optional uint64 board_idx = 6;

  oneof idx {
    uint64 board_idx = 7;
    uint64 comment_idx = 8;
  }
}

// ----------------- board ------------------
message GrpcNoticeListResponse {
  uint64 idx = 1;
  string title = 2;
  BoardState state = 3;
  int32 view_count = 4;
  bool is_pinned = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GrpcNoticeDetailResponse {
  uint64 idx = 1;
  string title = 2;
  BoardState state = 3;
  int32 view_count = 4;
  bool is_pinned = 5;
  google.protobuf.Timestamp updated_at = 6;
  string content = 7;
}

message GrpcNoticePageResponse {
  repeated GrpcNoticeListResponse items = 1;

  int32 total_count = 2;
  int32 current_page = 3;
  int32 total_pages = 4;
  bool has_next = 5;
}

message GrpcUpsertNoticeRequest {
  string title = 1;
  BoardState state = 2;
  bool is_pinned = 3;
  string content = 4;

  optional uint64 board_idx = 5;
}

message GrpcBoardIdxRequest {
  uint64 board_idx = 1;
}

// ----------------- board_comment ------------------

message GrpcCommentResponse {
  uint64 idx = 1;
  // parent만 optional 처리
  optional uint64 parent = 2;
  string user_nick_name = 3;
  string content = 4;
  BoardState state = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message GrpcCommentPageResponse {
  repeated GrpcCommentResponse items = 1;

  int32 total_count = 2;
  int32 current_page = 3;
  int32 total_pages = 4;
  bool has_next = 5;
}

message GrpcCommentIdxRequest {
  uint64 comment_idx = 1;
}

message GrpcUpsertCommentRequest {
  string content = 1;
  BoardState state = 2;
  optional uint64 parent = 3;

  oneof idx {
    uint64 board_idx = 5;
    uint64 comment_idx = 6;
  }
}

// ----------------- quiz-comment ------------------
message GrpcPagingQuizCommentRequest {
  // js 호환 상 int32 많이 쓴다고 함
  int32 page = 1;

  int32 size = 2;

  // nullable
  optional string search = 3;
  optional string filter = 4;
  optional string sort = 5;

  oneof idx {
    uint64 quiz_idx = 6;
    uint64 comment_idx = 8;
  }
}

message GrpcUpsertQuizCommentRequest {
  string content = 1;
  BoardState state = 2;
  optional uint64 parent = 3;

  oneof idx {
    uint64 quiz_idx = 5;
    uint64 comment_idx = 6;
  }
}
