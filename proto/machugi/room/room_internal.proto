syntax = "proto3";
package machugi.room;

import "google/protobuf/empty.proto";
import "machugi/room/room_dto.proto";

option csharp_namespace = "Room.Service.Proto";
// chat > Room
service RoomInternalService {
  // rpc IsUserInRoom(IsUserInRoomRequest) returns (IsUserInRoomResponse) {}
  rpc ExitUser(ExitUserRequest) returns (google.protobuf.Empty) {}
  rpc DeleteRoom(DeleteRoomRequest) returns (google.protobuf.Empty) {}
  rpc FindRoomInfo(GrpcRoomIdxRequest) returns (GrpcRoomInfoResponse) {}
}

// message IsUserInRoomRequest {
//   uint64 room_idx = 1;
//   uint64 user_idx = 2;
// }
// message IsUserInRoomResponse {
//   bool is_user = 1;
// }
message ExitUserRequest {
  uint64 room_idx = 1;
  uint64 user_idx = 2;
}
message DeleteRoomRequest {
  uint64 room_idx = 1;
}
