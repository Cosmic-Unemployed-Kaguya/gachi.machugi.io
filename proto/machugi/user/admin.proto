syntax = "proto3";

package machugi.admin;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "validate/validate.proto";
import "google/rpc/error_details.proto";

option java_multiple_files = true;
option java_package = "kaguya.grpc.admin";

service AdminService {

  rpc GetUserList (GetUsersInfoRequest) returns (GetUsersInfoResponse) {
    option (google.api.http) = {
      get: "/admin/users/info"
    };
  }

  rpc GetUserDetails (GetUserDetailsRequest) returns (GetUserDetailsResponse) {
    option (google.api.http) = {
      get: "/admin/users/{user_idx}"
    };
  }

  rpc UpdateNickname (UpdateNicknameRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/admin/users/{user_idx}/nickname"
      body: "*"
    };
  }

  rpc UpdateRole (UpdateRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/admin/users/{user_idx}/role"
      body: "*"
    };
  }

  rpc BlockUser (BlockRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/users/{user_idx}/block"
      body: "*"
    };
  }

  rpc GetBlockList (GetBlockListRequest) returns (GetBlocksInfoResponse) {
    option (google.api.http) = {
      get: "/admin/users/block/list"
    };
  }
}


// --- Enums ---
enum GrpcRole {
  ROLE_UNSPECIFIED = 0;
  USER = 1;
  ADMIN = 2;
}

enum GrpcStatus {
  STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  DORMANT = 2;
  SUSPENDED = 3;
  BANNED = 4;
  WITHDRAWAL = 5;
}

enum GrpcManagementType {
  MANAGEMENT_TYPE_UNSPECIFIED = 0;
  WARNING = 1;
  TEMP_BAN = 2;
  PERM_BAN = 3;
}

enum GrpcSearchType {
  SEARCH_TYPE_UNSPECIFIED = 0;
  EMAIL = 1;
  NICKNAME = 2;
}


// --- Request Messages ---

// 페이징 (공통)
message PageParam {
  int32 page = 1 [(validate.rules).int32.gte = 0];
  int32 size = 2 [(validate.rules).int32 = { gte: 0, lte: 100 }];  // 0 = 기본값 사용
}

// 유저 전체 조회 (검색/필터/페이징)
message GetUsersInfoRequest {
  UserSearchRequest condition = 1;
  PageParam page_param = 2;
  string order_by = 3 [(validate.rules).string = {
    max_len: 200,
    // 문법만 검사: '필드[ asc|desc]'를 쉼표로 연결(default는 asc). 공백은 자유롭게 허용, 빈 문자열 허용
    // ex. join_date desc, last_login_date
    pattern: "^\\s*$|^\\s*[a-z_]+(\\s+(asc|desc))?\\s*(,\\s*[a-z_]+(\\s+(asc|desc))?\\s*)*$"
  }];
}
message UserSearchRequest {
  // 0(UNSPECIFIED) 허용 = 필터 미적용
  GrpcSearchType search_type = 1 [(validate.rules).enum.defined_only = true];
  string keyword = 2;
  GrpcRole role = 3 [(validate.rules).enum.defined_only = true];
  GrpcStatus status = 4 [(validate.rules).enum.defined_only = true];
}

message GetUserDetailsRequest {
  int64 user_idx = 1 [(validate.rules).int64 = { gt: 0 }];  // idx는 1이상의 값
}

message UpdateNicknameRequest {
  int64 user_idx = 1 [(validate.rules).int64 = { gt: 0 }];
  string nickname = 2 [(validate.rules).string = {
    min_len: 1,
    pattern: "^.*\\S.*$"
  }];
}

message UpdateRoleRequest {
  int64 user_idx = 1 [(validate.rules).int64 = { gt: 0 }];

  GrpcRole role = 2 [(validate.rules).enum = {
    defined_only: true,
    not_in: [0]  // UNSPECIFIED(0) 값 허용 안 함 (@NotNull 역할)
  }];
}

message BlockRequest {
  int64 user_idx = 1 [(validate.rules).int64 = { gt: 0 }];
  GrpcManagementType management_type = 2 [(validate.rules).enum = {
    defined_only: true,
    not_in: [0]
  }];
  string reason = 3 [(validate.rules).string = {
    min_len: 1,
    pattern: "^.*\\S.*$"
  }];
  string end_date = 4;
}

// 블락 유저 전체 조회 (검색/필터/페이징)
message GetBlockListRequest {
  BlockSearchRequest condition = 1;
  PageParam page_param = 2;
  string order_by = 3 [(validate.rules).string = {
    max_len: 200,
    pattern: "^\\s*$|^\\s*[a-z_]+(\\s+(asc|desc))?\\s*(,\\s*[a-z_]+(\\s+(asc|desc))?\\s*)*$"
  }];
}
message BlockSearchRequest {
  // 0(UNSPECIFIED) 허용 = 필터 미적용
  GrpcSearchType search_type = 1 [(validate.rules).enum.defined_only = true];
  string keyword = 2;
  GrpcManagementType management_type = 3 [(validate.rules).enum.defined_only = true];
}


// --- Response Messages ---
message GetUsersInfoResponse {
  repeated GetUserDetailsResponse user_list = 1;
  int32 page = 2;
  int32 size = 3;
  int64 total_elements = 4;
  int32 total_pages = 5;
  bool has_next = 6;
}

message GetUserDetailsResponse {
  int64 idx = 1;
  string email = 2;
  string nickname = 3;
  int64 point = 4;
  string role = 5;
  string status = 6;
  string join_date = 7;
  string last_login_date = 8;
  string withdrawal_date = 9;
}

message GetBlocksInfoResponse {
  repeated GetBlockDetailsResponse block_list = 1;
  int32 page = 2;
  int32 size = 3;
  int64 total_elements = 4;
  int32 total_pages = 5;
  bool has_next = 6;
}

message GetBlockDetailsResponse {
  int64 idx = 1;
  int64 user_idx = 2;
  string user_email = 3;
  string user_nickname = 4;
  string management_type = 5;
  string reason = 6;
  string start_date = 7;
  string end_date = 8;
  string admin_nickname = 9;
}