syntax = "proto3";

package machugi.quiz;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "validate/validate.proto";

option java_multiple_files = true;
option java_package = "kaguya.grpc.quiz";

service QuestionService {

  rpc CreateQuestion (CreateQuestionRequest) returns (QuestionResponse) {
    option (google.api.http) = {
      post: "/quizzes/{quiz_idx}/questions"
      body: "*"
    };
  }

  rpc GetQuestion (GetQuestionRequest) returns (QuestionResponse) {
    option (google.api.http) = {
      get: "/questions/{question_idx}"
    };
  }

  rpc GetQuestionList (GetQuestionListRequest) returns (GetQuestionListResponse) {
    option (google.api.http) = {
      get: "/quizzes/{quiz_idx}/questions"
    };
  }

  rpc UpdateQuestion (UpdateQuestionRequest) returns (QuestionResponse) {
    option (google.api.http) = {
      patch: "/questions/{question_idx}"
      body: "*"
    };
  }

  rpc DeleteQuestion (DeleteQuestionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/questions/{question_idx}"
    };
  }
}

// --- Request Messages ---

message CreateQuestionRequest {
  int64 quiz_idx = 1 [(validate.rules).int64 = { gt: 0 }];

  optional string problem_text = 2 [(validate.rules).string = {
    max_len: 500
  }];

  optional string problem_url = 3 [(validate.rules).string = {
    max_len: 2048
  }];

  string type = 4 [(validate.rules).string = {
    min_len: 1,
    max_len: 20,
    pattern: "^.*\\S.*$"
  }];

  int32 sort_order = 5 [(validate.rules).int32 = { gte: 0 }];
}

message GetQuestionRequest {
  int64 question_idx = 1 [(validate.rules).int64 = { gt: 0 }];
}

message GetQuestionListRequest {
  int64 quiz_idx = 1 [(validate.rules).int64 = { gt: 0 }];
}

message UpdateQuestionRequest {
  int64 question_idx = 1 [(validate.rules).int64 = { gt: 0 }];

  optional string problem_text = 2 [(validate.rules).string = {
    max_len: 500
  }];

  optional string problem_url = 3 [(validate.rules).string = {
    max_len: 2048
  }];

  optional string type = 4 [(validate.rules).string = {
    min_len: 1,
    max_len: 20,
    pattern: "^.*\\S.*$"
  }];

  optional int32 sort_order = 5 [(validate.rules).int32 = { gte: 0 }];
}

message DeleteQuestionRequest {
  int64 question_idx = 1 [(validate.rules).int64 = { gt: 0 }];
}

// --- Response Messages ---

message QuestionResponse {
  int64 idx = 1;
  int64 quiz_idx = 2;
  string problem_text = 3;
  string problem_url = 4;
  string type = 5;
  int32 sort_order = 6;
  string created_date = 7;
  string updated_date = 8;
}

message GetQuestionListResponse {
  repeated QuestionResponse question_list = 1;
}