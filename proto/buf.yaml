# For details on buf.yaml configuration, visit https://buf.build/docs/configuration/v2/buf-yaml
version: v2

lint:
  use:
    - STANDARD
    
  except:
    - PACKAGE_VERSION_SUFFIX # 패키지 내 버전 명시 X  ex)~~/v1/~~
    - RPC_REQUEST_RESPONSE_UNIQUE # Req 중복 가능?
    - RPC_REQUEST_STANDARD_NAME   # Request 이름 규칙 무시 (Grpc~ 허용)
    - RPC_RESPONSE_STANDARD_NAME  # Response 이름 규칙 무시 (Grpc~ 허용)
    
breaking:
  use:
    - FILE