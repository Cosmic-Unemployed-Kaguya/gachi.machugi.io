admin:
  access_log_path: /dev/null
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address: { address: 0.0.0.0, port_value: 8080 }
    
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http

          # !! 웹소켓 업그레이드 허용
          upgrade_configs:
            - upgrade_type: "websocket"

          # 로그
          access_log:
            - name: envoy.access_loggers.stdout
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

          route_config:
            name: local_route
            virtual_hosts:

            # 어떤 도메인/IP로 들어오든 다 받음
            - name: all_services_host
              domains: ["*"]  

              # # !! 테스트용!! 헤더 강제 주입!!
              # request_headers_to_add:
              #   - header:
              #       key: "x-user-idx"
              #       value: "1"
              #   - header:
              #       key: "x-user-role"
              #       value: "USER"

              typed_per_filter_config:

                # CORS 정책 (Front 연동)
                envoy.filters.http.cors:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                  allow_origin_string_match:
                    - safe_regex:
                        google_re2: {}
                        regex: ".*"  # 로컬 테스트용 (모든 도메인 허용)
                  allow_methods: "GET, PUT, DELETE, POST, OPTIONS"
                  allow_headers: "content-type,authorization"
                  allow_credentials: true
                  max_age: "1728000"


              routes:

              # 인증(Auth) 서버 - REST API
              - match: { prefix: "/auth" }
                route: { cluster: auth_cluster }
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true

              # 인증메일 기능 (인증 패스)
              - match: { prefix: "/verifications" }
                route: { cluster: user_cluster }
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true

              # 비밀번호 초기화 (인증 패스)
              - match: { prefix: "/users/reset/password" }
                route: { cluster: user_cluster }
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true              
                          
              - match: { prefix: "/chat" }
                route: 
                  cluster: chat_node_cluster
                  timeout: 0s 
                  idle_timeout: 0s

              # 아무래도 겹치다보니까 일단 한개만 켜놓음; 

              # - match: { prefix: "/chat" }
              #   route: 
              #     cluster: chat_dotnet_cluster
              #     timeout: 0s 
              #     idle_timeout: 0s

              - match: { prefix: "/ws-chat" }
                route: 
                  cluster: chat_spring_cluster
                  timeout: 0s 
                  idle_timeout: 0s

              # gRPC 내부 패키지명 라우팅
              - match: { prefix: "/machugi.verification.VerificationService" }
                route: { cluster: user_cluster }
              - match: { prefix: "/machugi.user.UserService" }
                route: { cluster: user_cluster }
              - match: { prefix: "/machugi.admin.AdminService" }
                route: { cluster: user_cluster }
              # - match: { prefix: "/machugi.quiz.QuizGrpcManager" }
              #   route: { cluster: quiz_cluster }
              - match: { prefix: "/machugi.room.RoomGrpcManager" }
                route: { cluster: room_cluster }
              - match: { prefix: "/machugi.game.GameGrpcManager" }
                route: { cluster: game_cluster }                    
              - match: { prefix: "/machugi.board.NoticeGrpcService" }
                route: { cluster: board_cluster }
              - match: { prefix: "/machugi.board.BoardCommentGrpcService" }
                route: { cluster: board_cluster }
              - match: { prefix: "/machugi.board.QuizCommentGrpcService" }
                route: { cluster: board_cluster }


              # 그 외 경로 매칭(테스트 용 html 연동)
              - match: { prefix: "/" }
                # direct_response:
                #   status: 404
                #   body: { inline_string: "{\"status\": 404, \"message\": \"존재하지 않는 API 입니다.\"}" }
                route: { cluster: test_web_cluster }

                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true    
                    
          http_filters:
          # CORS 필터
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

          # 인증(Auth) 필터
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              failure_mode_allow: false
              
              http_service:
                server_uri:
                  uri: http://auth_cluster
                  cluster: auth_cluster
                  timeout: 0.5s

                # 프론트엔드 -> Envoy -> 인증 서버
                authorization_request:
                  allowed_headers:
                    patterns:
                    - exact: "cookie"
                    - exact: "authorization"

                # 인증 서버 -> Envoy -> 프론트엔드
                authorization_response:
                  allowed_upstream_headers:
                    patterns:
                    - exact: "set-cookie"
                    - exact: "x-user-idx"
                    - exact: "x-user-role"
                  allowed_client_headers:
                    patterns:
                    - exact: "set-cookie"

          # REST -> gRPC 변환 필터
          - name: envoy.filters.http.grpc_json_transcoder
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
              proto_descriptor: "/tmp/descriptor.pb"
              services: 
                - "machugi.user.UserService"
                - "machugi.verification.VerificationService"
                # - "machugi.quiz.QuizGrpcManager"
                - "machugi.room.RoomGrpcManager"
                - "machugi.game.GameGrpcManager"
                - "machugi.board.BoardCommentGrpcService"
                - "machugi.board.NoticeGrpcService"
                - "machugi.board.QuizCommentGrpcService"
                                                
              print_options:
                add_whitespace: true
                always_print_primitive_fields: true

          # 라우팅 필터
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router


  clusters:
  - name: chat_node_cluster
    connect_timeout: 0.25s
    type: LOGICAL_DNS

    load_assignment:
      cluster_name: chat_node_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: chat-node-service, port_value: 8080 }

  - name: chat_dotnet_cluster
    connect_timeout: 0.25s
    type: LOGICAL_DNS

    load_assignment:
      cluster_name: chat_dotnet_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: chat-dotnet-service, port_value: 8080 }

  - name: chat_spring_cluster
    connect_timeout: 0.25s
    type: LOGICAL_DNS

    load_assignment:
      cluster_name: chat_spring_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: chat-spring-service, port_value: 8080 }

  # 인증(Auth) 클러스터
  - name: auth_cluster
    connect_timeout: 0.25s
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: auth_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: user-service, port_value: 8080 }

  # 유저(User) 클러스터
  - name: user_cluster
    connect_timeout: 0.25s 
    type: LOGICAL_DNS
    http2_protocol_options: {} 
    load_assignment:
      cluster_name: user_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: user-service, port_value: 9090 }

  # 퀴즈(Quiz) 클러스터
  - name: quiz_cluster
    connect_timeout: 0.25s
    type: LOGICAL_DNS
    http2_protocol_options: {}
    load_assignment:
      cluster_name: quiz_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: quiz-service , port_value: 9090 }

  # 방(Room) 클러스터
  - name: room_cluster
    connect_timeout: 5s
    type: LOGICAL_DNS
    http2_protocol_options: {}
    load_assignment:
      cluster_name: room_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: room-service , port_value: 9090 }
  
  # 게임(game) 클러스터
  - name: game_cluster
    connect_timeout: 5s
    type: LOGICAL_DNS
    http2_protocol_options: {}
    load_assignment:
      cluster_name: game_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: game-service , port_value: 9090 }

  # 게시판(Board) 클러스터
  - name: board_cluster
    connect_timeout: 0.25s
    type: LOGICAL_DNS
    http2_protocol_options: {}
    load_assignment:
      cluster_name: board_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: board-service, port_value: 9090 }

  - name: test_web_cluster
    type: STRICT_DNS
    load_assignment:
      cluster_name: test_web
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: test-web, port_value: 80 }