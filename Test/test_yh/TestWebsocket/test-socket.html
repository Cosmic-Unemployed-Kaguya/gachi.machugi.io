<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>채팅 지연시간(Latency) 테스트</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <h2>웹소켓 테스트 패널</h2>
    
    <div>
        <label>서버 주소: </label>
        <input type="text" id="serverUrl" value="http://localhost:8080/" style="width: 250px;">
        <button onclick="connectSocket()">1. 연결하기</button>
    </div>
    
    <div style="margin-top: 10px;">
        <label>방 번호: </label>
        <input type="text" id="roomId" value="room_1">
        <button onclick="joinRoom()">2. 방 입장</button>
    </div>

    <div style="margin-top: 10px;">
        <label>메시지: </label>
        <input type="text" id="messageInput" value="테스트 메시지입니다">
        <button onclick="sendMessage()">3. 메시지 전송 (시간 측정)</button>
    </div>

    <hr>
    <h3>로그 및 응답 속도</h3>
    <div id="logArea" style="background: #f4f4f4; padding: 10px; height: 300px; overflow-y: auto; font-family: monospace;"></div>

    <script>
        let socket;
        let sendTimestamp = 0; // 메시지 보낸 시간을 기록할 변수

        // 화면에 로그를 찍어주는 간단한 함수
        function printLog(text) {
            const logArea = document.getElementById('logArea');
            logArea.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${text}</div>`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        // 1. 소켓 연결
        function connectSocket() {
            const url = document.getElementById('serverUrl').value;
            
            // 💡 모르는 부분 2: Envoy의 라우팅 Path에 따라 path 설정이 추가로 필요할 수 있습니다. 
            // (예: path: '/chat/socket.io' 등)
            socket = io(url, {
                transports: ['websocket'] // HTTP 폴링 건너뛰고 바로 웹소켓으로 붙기
            });

            socket.on('connect', () => {
                printLog(`🟢 서버 연결 성공! (Socket ID: ${socket.id})`);
            });


            socket.on('server_info', (data) => {
                printLog(`🏢 현재 연결된 서버(Pod): <b>${data.connectedPod}</b>`);
            });

            socket.on('disconnect', () => {
                printLog('🔴 서버와 연결이 끊어졌습니다.');
            });

            socket.on('connect_error', (err) => {
                printLog(`❌ 연결 에러: ${err.message}`);
            });

            // 💡 서버에서 보내는 방 입장 성공 이벤트 수신
            socket.on('join_success', (data) => {
                printLog(`✅ 방 입장 성공: ${data.userNickname}`);
            });

            // 💡 서버에서 보내는 메시지 수신 및 [시간 측정]
            socket.on('message', (data) => {
                if (sendTimestamp !== 0) {
                    const rtt = (performance.now() - sendTimestamp).toFixed(2);
                    
                    printLog(`📩 [수신] ${data.userNickname}: ${data.msg}`);
                    printLog(`⏱️ [속도 측정] 요청부터 응답까지 <b>${rtt}ms</b> 걸렸습니다.`);
                    
                    sendTimestamp = 0; // 초기화
                } else {
                    // 내가 보낸게 아니라 남이 보낸 메시지를 받을 때
                    printLog(`📩 [수신] ${data.userNickname}: ${data.msg}`);
                }
            });
        }

        // 2. 방 입장 요청
        function joinRoom() {
            if (!socket || !socket.connected) return alert('먼저 서버에 연결하세요!');
            
            const roomId = document.getElementById('roomId').value;
            socket.emit('join_room', { roomId: roomId });
            printLog(`🚪 방 입장 요청 중... (Room: ${roomId})`);
        }

        // 3. 메시지 전송
        function sendMessage() {
            if (!socket || !socket.connected) return alert('먼저 서버에 연결하세요!');
            
            const msg = document.getElementById('messageInput').value;
            
            // 전송 직전의 시간 기록 (밀리초 단위)
            sendTimestamp = performance.now();
            
            socket.emit('message', { msg: msg });
            printLog(`📤 [전송] ${msg}`);
        }
    </script>
</body>
</html>
