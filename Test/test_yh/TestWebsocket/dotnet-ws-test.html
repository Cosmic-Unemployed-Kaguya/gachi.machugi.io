<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>.NET SignalR 성능 테스트 (투스텝 연결)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; background-color: #f9f9f9; }
        .panel { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px; background-color: #fff; }
        .panel h3 { margin-top: 0; color: #333; font-size: 16px; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: inline-block; width: 100px; font-weight: bold; font-size: 14px;}
        input[type="text"] { padding: 6px; width: 200px; border: 1px solid #ccc; border-radius: 4px; }
        input.msg-input { width: 450px; }
        button { padding: 6px 15px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #chatBox { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 15px; background: #fafafa; margin-bottom: 15px; border-radius: 5px; }
        .msg { margin-bottom: 8px; font-size: 14px; line-height: 1.4; }
        .sys-msg { color: #d9534f; font-weight: bold; } /* 시스템 공지 */
        .rtt-msg { color: #0275d8; font-weight: bold; } /* 속도 측정 로그 */
        .user-msg { color: #333; }
    </style>
</head>
<body>

<h2>.NET SignalR 투스텝 연결 및 성능 테스트</h2>

<div class="panel">
    <h3>1. 사전 예약 및 소켓 연결</h3>
    <div class="input-group">
        <label>서버 URL:</label>
        <input type="text" id="serverUrl" value="http://localhost:8080/dotnet">
    </div>
    <div class="input-group">
        <label>방 번호(Room):</label>
        <input type="text" id="roomId" value="room_1">
    </div>
    <div class="input-group">
        <label>내 닉네임:</label>
        <input type="text" id="userIdx" value="TestUser">
        <button id="connectBtn" onclick="reserveAndConnect()">예약 후 접속하기</button>
        <span id="statusText" style="color: red; font-weight: bold; margin-left: 10px;">연결 끊김</span>
    </div>
</div>

<div id="chatBox"></div>

<div class="panel">
    <h3>2. 메시지 전송 (PING-PONG / 대화)</h3>
    <div class="input-group">
        <label>메시지:</label>
        <input type="text" id="roomMsg" class="msg-input" placeholder="메시지 또는 PING 입력" disabled>
        <button id="sendBtn" onclick="sendRoomTalk()" disabled>전송 (SendMessage)</button>
    </div>
</div>

<script>
    let connection = null;
    let sendTimestamp = 0; // RTT 측정용 변수

    function logMessage(text, typeClass = "user-msg") {
        const chatBox = document.getElementById("chatBox");
        const div = document.createElement("div");
        div.className = "msg " + typeClass;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- 핵심 투스텝 로직: 1. API 예약 -> 2. 소켓 연결 ---
    async function reserveAndConnect() {
        const serverUrl = document.getElementById("serverUrl").value;
        const roomId = document.getElementById("roomId").value;
        const userIdx = document.getElementById("userIdx").value;

        if (!serverUrl || !roomId || !userIdx) {
            alert("입력값을 모두 채워주세요.");
            return;
        }

        document.getElementById("connectBtn").disabled = true;
        logMessage("🔄 [1단계] 서버에 입장 예약을 요청합니다...", "sys-msg");

        try {
            // 1단계: ChatController.cs 의 [HttpPost("reserve")] 호출
            const response = await fetch(`${serverUrl}/chat/reserve`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ userIdx: userIdx, roomId: roomId }) // JoinRoomDto 구조
            });

            if (!response.ok) {
                throw new Error("예약 API 호출 실패 (HTTP " + response.status + ")");
            }
            logMessage("✅ [1단계 완료] 예약 성공! 웹소켓 연결을 시도합니다.", "sys-msg");

        } catch (error) {
            logMessage(`❌ [예약 실패] ${error.message}`, "sys-msg");
            document.getElementById("connectBtn").disabled = false;
            return;
        }

        // 2단계: ChatHub.cs 의 OnConnectedAsync() 통과를 위한 쿼리스트링 연결
        const socketUrl = `${serverUrl}/chat?userIdx=${encodeURIComponent(userIdx)}`;
        
        connection = new signalR.HubConnectionBuilder()
            .withUrl(socketUrl, {
                skipNegotiation: true, // 💡 핵심 1: 불필요한 HTTP 협상 과정(negotiate) 강제 생략!
                transport: signalR.HttpTransportType.WebSockets // 💡 핵심 2: 오직 순수 웹소켓만 사용!
            })
            .withAutomaticReconnect()
            .build();

        // 이벤트 1: 누군가 방에 들어왔을 때 (ChatService.cs -> Notice)
        connection.on("Notice", (message) => {
            logMessage(`📢 [알림] ${message}`, "sys-msg");
        });

        // 이벤트 2: 메시지 수신 (ChatHub.cs -> BroadcastMessage)
        connection.on("BroadcastMessage", (user, message) => {
            
            // ⏱️ 내가 보낸 메시지(또는 시스템 PONG)가 돌아왔을 때 RTT 계산
            if ((user === userIdx || (user === "System" && message === "PONG")) && sendTimestamp !== 0) {
                const rtt = (performance.now() - sendTimestamp).toFixed(2);
                logMessage(`⏱️ [속도 측정] RTT: ${rtt}ms`, "rtt-msg");
                sendTimestamp = 0; // 타이머 초기화
            }

            if (user === "System") {
                logMessage(`📢 [${user}]: ${message}`, "sys-msg");
            } else {
                logMessage(`👤 [${user}]: ${message}`);
            }
        });

        // 연결 시작
        try {
            await connection.start();
            document.getElementById("statusText").textContent = "연결 완료!";
            document.getElementById("statusText").style.color = "green";
            document.getElementById("roomMsg").disabled = false;
            document.getElementById("sendBtn").disabled = false;
            logMessage("🚀 [2단계 완료] SignalR 웹소켓이 정상적으로 연결되었습니다.", "sys-msg");
        } catch (error) {
            logMessage(`❌ [연결 실패] 웹소켓 연결 거부됨: ${error.toString()}`, "sys-msg");
            document.getElementById("connectBtn").disabled = false;
        }
    }

    // --- 메시지 전송 로직 ---
    function sendRoomTalk() {
        if (!connection || connection.state !== signalR.HubConnectionState.Connected) return;
        
        const roomId = document.getElementById("roomId").value;
        const userIdx = document.getElementById("userIdx").value;
        const msgInput = document.getElementById("roomMsg");
        const message = msgInput.value;

        if (!message.trim()) return;

        // ⏱️ 전송 직전 시간 기록
        sendTimestamp = performance.now();

        // ChatHub.cs 의 SendMessage(string roomId, string userId, string message) 호출
        connection.invoke("SendMessage", roomId, userIdx, message)
            .then(() => { msgInput.value = ""; })
            .catch(err => {
                console.error("전송 실패: ", err);
                sendTimestamp = 0;
            });
    }

    // 엔터키 지원
    document.getElementById("roomMsg").addEventListener("keyup", (e) => {
        if (e.key === "Enter") sendRoomTalk();
    });
</script>

</body>
</html>
