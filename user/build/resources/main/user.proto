syntax = "proto3";

package gachi.machugi.grpc.user;

import "google/api/annotations.proto";

option java_multiple_files = true;
option java_package = "kaguya.grpc.user";

service UserService {
  rpc restTest (TestRequest) returns (TestResponse) {
    option (google.api.http) = {
      post: "/user/test"
      body: "*"
    };
  }
}

message TestRequest {
  string username = 1;
  string name = 2;
}

message TestResponse {
  string status = 1;
  string message = 2;
}