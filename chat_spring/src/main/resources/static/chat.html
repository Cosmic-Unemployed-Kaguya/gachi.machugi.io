<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>STOMP 통합 테스트 (Lobby, Room, Broadcast, DM)</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .panel { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; background-color: #fcfcfc; }
        .panel h3 { margin-top: 0; color: #333; font-size: 16px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .input-group { margin-bottom: 10px; margin-top: 10px;}
        .input-group label { display: inline-block; width: 90px; font-weight: bold; font-size: 14px;}
        input[type="text"] { padding: 5px; width: 180px; }
        input.msg-input { width: 400px; }
        button { padding: 5px 15px; cursor: pointer; }
        #chatBox { border: 1px solid #999; height: 350px; overflow-y: scroll; padding: 10px; background: #fff; margin-bottom: 15px; }
        .msg { margin-bottom: 5px; font-size: 14px; line-height: 1.4; }
        .sys-msg { color: #888; font-style: italic; }
        .lobby-msg { color: #0275d8; font-weight: bold; }
        .room-msg { color: #d9534f; font-weight: bold; }
        .br-msg { color: #5cb85c; font-weight: bold; }
        .dm-msg { color: #f0ad4e; font-weight: bold; }
    </style>
</head>
<body>

<h2>STOMP 웹소켓 통합 테스트</h2>

<div class="panel">
    <h3>1. 서버 연결</h3>
    <div class="input-group">
        <label>서버 URL:</label>
        <input type="text" id="serverUrl" value="ws://localhost:8080/ws-chat">
    </div>
    <div class="input-group">
        <label>내 닉네임:</label>
        <input type="text" id="myId" value="user1">
        <button onclick="connect()">연결하기 (자동 구독 포함)</button>
        <button onclick="disconnect()">종료하기</button>
        <span id="connectionStatus" style="color: red; font-weight: bold; margin-left: 10px;">연결 끊김</span>
    </div>
</div>

<div id="chatBox"></div>

<div class="panel" style="background-color: #eef7fe;">
    <h3>2. 로비 (Lobby)</h3>
    <button onclick="enterLobby()">로비 입장 (ENTER)</button>
    <div class="input-group">
        <label>로비 메시지:</label>
        <input type="text" id="lobbyMsg" class="msg-input" placeholder="로비에 보낼 메시지">
        <button onclick="sendLobbyTalk()">로비 전송 (TALK)</button>
    </div>
</div>

<div class="panel" style="background-color: #fef0f0;">
    <h3>3. 방 (Room)</h3>
    <div class="input-group">
        <label>방 번호:</label>
        <input type="text" id="roomId" value="room1">
        <button onclick="enterRoom()">방 입장 (ENTER)</button>
    </div>
    <div class="input-group">
        <label>방 메시지:</label>
        <input type="text" id="roomMsg" class="msg-input" placeholder="현재 방에 보낼 메시지">
        <button onclick="sendRoomTalk()">방 전송 (TALK)</button>
    </div>
</div>

<div class="panel" style="background-color: #effcf3;">
    <h3>4. 글로벌 기능 (Broadcast / DM)</h3>
    <div class="input-group">
        <label>전체공지:</label>
        <input type="text" id="broadcastMsg" class="msg-input" placeholder="모든 사용자에게 보낼 메시지">
        <button onclick="sendBroadcast()">공지 전송</button>
    </div>
    <div class="input-group">
        <label>귓속말 대상:</label>
        <input type="text" id="dmReceiver" placeholder="받는 사람 닉네임">
    </div>
    <div class="input-group">
        <label>귓속말 내용:</label>
        <input type="text" id="dmMsg" class="msg-input" placeholder="귓속말 내용">
        <button onclick="sendDM()">귓속말 전송</button>
    </div>
</div>

<script>
    let stompClient = null;
    let lobbySubscription = null;
    let roomSubscription = null;

    function logMessage(text, typeClass = "") {
        const chatBox = document.getElementById("chatBox");
        const div = document.createElement("div");
        div.className = "msg " + typeClass;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getSender() {
        return document.getElementById("myId").value;
    }

    function connect() {
        if (stompClient !== null && stompClient.active) {
            alert("이미 연결되어 있습니다.");
            return;
        }

        const url = document.getElementById("serverUrl").value;
        const myId = getSender();

        if(!myId) {
            alert("닉네임을 입력해주세요.");
            return;
        }

        stompClient = new StompJs.Client({
            brokerURL: url,
            reconnectDelay: 5000,
            onConnect: (frame) => {
                document.getElementById("connectionStatus").textContent = `연결됨 (${myId})`;
                document.getElementById("connectionStatus").style.color = "green";
                logMessage("서버와 연결되었습니다.", "sys-msg");

                // 💡 연결 성공 시 기본적으로 글로벌 채널(공지, 내 귓속말 큐) 구독
                subscribeGlobalChannels(myId);

                // 필요시 연결 직후 로비 자동 입장 활성화
                enterLobby();
            },
            onWebSocketClose: () => {
                document.getElementById("connectionStatus").textContent = "연결 끊김";
                document.getElementById("connectionStatus").style.color = "red";
                logMessage("서버와 연결이 종료되었습니다.", "sys-msg");
            }
        });

        stompClient.activate();
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.deactivate();
            lobbySubscription = null;
            roomSubscription = null;
        }
    }

    // --- 글로벌(전체공지, DM) 구독 ---
    function subscribeGlobalChannels(myId) {
        // 1. 전체 공지 구독 (/topic/broadcast)
        stompClient.subscribe('/topic/broadcast', (message) => {
            const data = JSON.parse(message.body);
            logMessage(`[전체공지] ${data.sender}: ${data.message}`, "br-msg");
        });

        // 2. 내 전용 DM 큐 구독 (/queue/dm/{내아이디})
        stompClient.subscribe(`/queue/dm/${myId}`, (message) => {
            const data = JSON.parse(message.body);
            logMessage(`[DM] ${data.sender}: ${data.message}`, "dm-msg");
        });
    }

    // --- Lobby Functions ---
    function enterLobby() {
        if (!stompClient || !stompClient.active) return;

        if (lobbySubscription) {
            lobbySubscription.unsubscribe();
        }

        // 로비 채팅 구독 (/topic/lobby)
        lobbySubscription = stompClient.subscribe(`/topic/lobby`, (message) => {
            const data = JSON.parse(message.body);
            logMessage(`[로비] ${data.sender}: ${data.message}`, "lobby-msg");
        });

        // 로비 입장 요청 (컨트롤러 규격에 맞춰 DM 형태로 내게 알림이 오도록 요청)
        stompClient.publish({
            destination: `/app/chat.lobby.enter`,
            body: JSON.stringify({ sender: getSender(), receiver: getSender() })
        });
    }

    function sendLobbyTalk() {
        if (!stompClient || !stompClient.active) return;
        const msg = document.getElementById("lobbyMsg").value;

        stompClient.publish({
            destination: `/app/chat.lobby.talk`,
            body: JSON.stringify({ sender: getSender(), message: msg })
        });
        document.getElementById("lobbyMsg").value = "";
    }

    // --- Room Functions ---
    function enterRoom() {
        if (!stompClient || !stompClient.active) {
            alert("먼저 연결을 진행해주세요.");
            return;
        }

        const roomId = document.getElementById("roomId").value;

        if (roomSubscription) {
            roomSubscription.unsubscribe();
        }

        // 방 채팅 구독 (/topic/room/{roomId})
        roomSubscription = stompClient.subscribe(`/topic/room/${roomId}`, (message) => {
            const data = JSON.parse(message.body);
            logMessage(`[방:${roomId}] ${data.sender}: ${data.message}`, "room-msg");
        });

        stompClient.publish({
            destination: `/app/chat.room.${roomId}.enter`,
            body: JSON.stringify({ sender: getSender() })
        });
    }

    function sendRoomTalk() {
        if (!stompClient || !stompClient.active) return;
        const roomId = document.getElementById("roomId").value;
        const msg = document.getElementById("roomMsg").value;

        stompClient.publish({
            destination: `/app/chat.room.${roomId}.talk`,
            body: JSON.stringify({ sender: getSender(), message: msg })
        });
        document.getElementById("roomMsg").value = "";
    }

    // --- Global Functions (Broadcast, DM) ---
    function sendBroadcast() {
        if (!stompClient || !stompClient.active) return;
        const msg = document.getElementById("broadcastMsg").value;

        stompClient.publish({
            destination: `/app/chat.broadcast`,
            body: JSON.stringify({ sender: getSender(), message: msg })
        });
        document.getElementById("broadcastMsg").value = "";
    }

    function sendDM() {
        if (!stompClient || !stompClient.active) return;
        const receiver = document.getElementById("dmReceiver").value;
        const msg = document.getElementById("dmMsg").value;

        if (!receiver) {
            alert("받는 사람 닉네임을 입력하세요.");
            return;
        }

        stompClient.publish({
            destination: `/app/chat.dm`,
            body: JSON.stringify({ sender: getSender(), receiver: receiver, message: msg })
        });

        // 보낸 메시지는 내 화면에도 표시 (본인에게 서버가 반송하지 않는 구조이므로 프론트에서 처리)
        logMessage(`[DM 발송 -> ${receiver}] ${msg}`, "dm-msg");
        document.getElementById("dmMsg").value = "";
    }
</script>

</body>
</html>
