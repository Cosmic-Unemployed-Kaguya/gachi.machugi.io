<!-- 제미나이로 딸깍한 페이지 (작동 테스트용 페이지) -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>STOMP 통합 테스트 (Room, Broadcast, DM)</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .panel { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; background-color: #fcfcfc; }
        .panel h3 { margin-top: 0; color: #333; font-size: 16px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: inline-block; width: 90px; font-weight: bold; font-size: 14px;}
        input[type="text"] { padding: 5px; width: 180px; }
        input.msg-input { width: 400px; }
        button { padding: 5px 15px; cursor: pointer; }
        #chatBox { border: 1px solid #999; height: 350px; overflow-y: scroll; padding: 10px; background: #fff; margin-bottom: 15px; }
        .msg { margin-bottom: 5px; font-size: 14px; line-height: 1.4; }
        .sys-msg { color: #888; font-style: italic; }
        .dm-msg { color: #d9534f; font-weight: bold; }
        .br-msg { color: #0275d8; font-weight: bold; }
    </style>
</head>
<body>

<h2>STOMP 웹소켓 통합 테스트</h2>

<div class="panel">
    <h3>1. 서버 연결</h3>
    <div class="input-group">
        <label>서버 URL:</label>
        <input type="text" id="serverUrl" value="ws://localhost:8081/ws-stomp">
    </div>
    <div class="input-group">
        <label>내 닉네임:</label>
        <input type="text" id="myId" value="user1">
        <button onclick="connect()">연결하기</button>
        <button onclick="disconnect()">종료하기</button>
        <span id="connectionStatus" style="color: red; font-weight: bold; margin-left: 10px;">연결 끊김</span>
    </div>
</div>

<div id="chatBox"></div>

<div class="panel">
    <h3>2. 방(Room) 채팅</h3>
    <div class="input-group">
        <label>방 번호:</label>
        <input type="text" id="roomId" value="room1">
        <button onclick="enterRoom()">방 입장 (ENTER)</button>
    </div>
    <div class="input-group">
        <label>방 메시지:</label>
        <input type="text" id="roomMsg" class="msg-input" placeholder="현재 방에 보낼 메시지">
        <button onclick="sendRoomTalk()">방 전송 (TALK)</button>
    </div>
</div>

<div class="panel" style="background-color: #eef7fe;">
    <h3>3. 전체 공지 (Broadcast)</h3>
    <div class="input-group">
        <label>공지 내용:</label>
        <input type="text" id="broadcastMsg" class="msg-input">
        <button onclick="sendBroadcast()">전체 전송 (BROADCAST)</button>
    </div>
</div>

<div class="panel" style="background-color: #fef0f0;">
    <h3>4. 귓속말 (DM)</h3>
    <div class="input-group">
        <label>받는 사람:</label>
        <input type="text" id="receiverId" placeholder="상대방 닉네임">
    </div>
    <div class="input-group">
        <label>DM 내용:</label>
        <input type="text" id="dmMsg" class="msg-input">
        <button onclick="sendDM()">귓속말 전송 (DM)</button>
    </div>
</div>

<script>
    let stompClient = null;
    let roomSubscription = null;

    function logMessage(text, typeClass = "") {
        const chatBox = document.getElementById("chatBox");
        const div = document.createElement("div");
        div.className = "msg " + typeClass;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getSender() {
        return document.getElementById("myId").value;
    }

    function connect() {
        if (stompClient !== null && stompClient.active) {
            alert("이미 연결되어 있습니다.");
            return;
        }

        const url = document.getElementById("serverUrl").value;
        const myId = getSender();

        if(!myId) {
            alert("닉네임을 입력해주세요.");
            return;
        }

        stompClient = new StompJs.Client({
            brokerURL: url,
            reconnectDelay: 5000,
            onConnect: (frame) => {
                document.getElementById("connectionStatus").textContent = `연결됨 (${myId})`;
                document.getElementById("connectionStatus").style.color = "green";
                logMessage("서버와 연결되었습니다.", "sys-msg");

                stompClient.subscribe('/topic/broadcast', (message) => {
                    const data = JSON.parse(message.body);
                    logMessage(`[📢전체공지] ${data.sender}: ${data.message}`, "br-msg");
                });

                stompClient.subscribe(`/queue/dm/${myId}`, (message) => {
                    const data = JSON.parse(message.body);
                    logMessage(`[💌귓속말 from ${data.sender}] ${data.message}`, "dm-msg");
                });
            },
            onWebSocketClose: () => {
                document.getElementById("connectionStatus").textContent = "연결 끊김";
                document.getElementById("connectionStatus").style.color = "red";
                logMessage("서버와 연결이 종료되었습니다.", "sys-msg");
            }
        });

        stompClient.activate();
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.deactivate();
            roomSubscription = null;
        }
    }

    function enterRoom() {
        if (!stompClient || !stompClient.active) {
            alert("먼저 연결을 진행해주세요.");
            return;
        }

        const roomId = document.getElementById("roomId").value;

        if (roomSubscription) {
            roomSubscription.unsubscribe();
        }

        roomSubscription = stompClient.subscribe(`/topic/room/${roomId}`, (message) => {
            const data = JSON.parse(message.body);

            if (data.type === "ENTER" || data.sender === "SYSTEM") {
                logMessage(`[방:${roomId}] ${data.message}`, "sys-msg");
            } else {
                logMessage(`[방:${roomId}] ${data.sender}: ${data.message}`);
            }
        });

        stompClient.publish({
            destination: `/app/chat.room.${roomId}.enter`,
            body: JSON.stringify({ sender: getSender() })
        });
    }

    function sendRoomTalk() {
        if (!stompClient || !stompClient.active) return;
        const roomId = document.getElementById("roomId").value;
        const msg = document.getElementById("roomMsg").value;

        stompClient.publish({
            destination: `/app/chat.room.${roomId}.talk`,
            body: JSON.stringify({ sender: getSender(), message: msg })
        });
        document.getElementById("roomMsg").value = "";
    }

    function sendBroadcast() {
        if (!stompClient || !stompClient.active) return;
        const msg = document.getElementById("broadcastMsg").value;

        stompClient.publish({
            destination: `/app/chat.broadcast`,
            body: JSON.stringify({ sender: getSender(), message: msg })
        });
        document.getElementById("broadcastMsg").value = "";
    }

    function sendDM() {
        if (!stompClient || !stompClient.active) return;
        const receiver = document.getElementById("receiverId").value;
        const msg = document.getElementById("dmMsg").value;

        if (!receiver) {
            alert("받는 사람 닉네임을 입력하세요.");
            return;
        }

        stompClient.publish({
            destination: `/app/chat.dm`,
            body: JSON.stringify({ sender: getSender(), receiver: receiver, message: msg })
        });

        logMessage(`[💌귓속말 to ${receiver}] ${msg}`, "dm-msg");
        document.getElementById("dmMsg").value = "";
    }
</script>

</body>
</html>
