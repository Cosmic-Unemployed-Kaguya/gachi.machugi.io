apiVersion: apps/v1
 
kind: Deployment

metadata:
  name: gateway
  labels:
    app: gateway

spec:

  selector:
    matchLabels:
      app: gateway

  replicas: 1

  template:
    
    metadata:
      labels:
        app: gateway

    spec:
      containers:
        - name: gateway
          image: geteway:1.2

          ports:
            - containerPort: 8080
