apiVersion: apps/v1
 
kind: Deployment

metadata:
  name: node-a
  labels:
    app: node-a

spec:

  selector:
    matchLabels:
      app: node-a

  replicas: 1

  template:
    
    metadata:
      labels:
        app:  node-a

    spec:
      containers:
        - name: node-a
          image: test-node-service:1.1

          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: node-a-env