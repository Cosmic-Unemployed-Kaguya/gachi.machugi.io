# Service B 
apiVersion: v1
kind: Service
metadata:
  name: service-b
spec:
  selector:
    app: service-b
  ports:
    - name: grpc
      protocol: TCP
      port: 9090
      targetPort: 9090

    - name: http 
      protocol: TCP
      port: 8080
      targetPort: 8080
---
# Service A 
apiVersion: v1
kind: Service
metadata:
  name: service-a
spec:
  selector:
    app: service-a
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
