apiVersion: apps/v1

kind: StatefulSet

metadata:
  name: postgres

spec:

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  serviceName: "postgres-service"

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:17.9
          
          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: node-a-env
                  key: DB_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: node-a-env
                  key: DB_DATABASE

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: node-a-env
                  key: DB_PASSWORD

  
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data 
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        # storageClassName: "hostpath"
        resources:
          requests:
            storage: 3Gi


