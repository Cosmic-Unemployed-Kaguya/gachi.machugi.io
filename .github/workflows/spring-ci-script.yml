name: Spring CI 스크립트

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string

jobs:
  code-test:
    name: 코드 테스트
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 브랜치로 체크아웃
        uses: actions/checkout@v5

      - name: JDK 세팅
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: user test yml 세팅
        if: ${{ inputs.service-name == 'user' }}
        run: |
          mkdir -p ./${{ inputs.service-name }}/src/test/resources
          echo '${{ secrets.USER_TEST_YML }}' > ./${{ inputs.service-name }}/src/test/resources/application-test.yml

#      - 최상위 폴더에 스프링 구축 시 해결 됨. 현재는 없음.
#      - name: gradlew 권한 세팅
#        run: chmod +x ./gradlew

      - name: gradlew 권한 세팅
        run: chmod +x ./${{ inputs.service-name }}/gradlew

      - name: 테스트 실행
        working-directory: ./${{ inputs.service-name }}
        run: ./gradlew test --no-daemon