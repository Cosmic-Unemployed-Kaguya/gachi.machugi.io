
name: Quiz 서비스 CI 스크립트

on:
  pull_request:
    branches:
      - quiz
    paths: #얘 수정 밑에 이거
      - 'quiz/**'

#각 서비스에 맞게 ci-script 선택, dotnet이랑 node.js는 알아서 만들어야 할 듯
jobs:
  execute-test:
    uses: ./.github/workflows/spring-ci-script.yml
    secrets: inherit
    with:
      service-name: quiz/quiz